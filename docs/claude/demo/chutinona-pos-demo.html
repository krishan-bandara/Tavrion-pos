<title>චූටිනෝනා POS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;600;700&family=Rubik:wght@400;500;600&display=swap">
<style>
/* Chutinona POS - kiosk UI for a 15.6" 1366x768 touch screen.
   Left nav rail, rounded cards, tea-green brand, turmeric accent, soft depth, spring motion (reduced-motion safe). */
:root{
  --bg:#edf2ec;--panel:#ffffff;--panel2:#f4f8f4;--ink:#122319;--muted:#5d7065;--line:#dce6de;
  --tea:#17784a;--tea2:#0e5636;--tea-ink:#ffffff;--turmeric:#f4b62a;--chilli:#e5533d;--ok:#1d9a5a;--tile:#ffffff;--tile-hover:#f1f8f2;
  --sh1:0 1px 2px rgba(18,35,25,.06),0 8px 20px -10px rgba(18,35,25,.22);--sh2:0 24px 60px -18px rgba(8,24,15,.45);
  --si:"Noto Sans Sinhala","Iskoola Pota",system-ui,sans-serif;--num:"Rubik","Segoe UI",system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a120e;--panel:#121e18;--panel2:#16251d;--ink:#e8f1eb;--muted:#8da598;--line:#223228;
  --tea:#33b676;--tea2:#1b8a55;--tea-ink:#04170d;--turmeric:#f7c24a;--chilli:#ff7b64;--ok:#4cd08a;--tile:#15241c;--tile-hover:#1c3026;
  --sh1:0 1px 2px rgba(0,0,0,.4),0 8px 20px -10px rgba(0,0,0,.6);--sh2:0 24px 60px -18px rgba(0,0,0,.8);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a120e;--panel:#121e18;--panel2:#16251d;--ink:#e8f1eb;--muted:#8da598;--line:#223228;
  --tea:#33b676;--tea2:#1b8a55;--tea-ink:#04170d;--turmeric:#f7c24a;--chilli:#ff7b64;--ok:#4cd08a;--tile:#15241c;--tile-hover:#1c3026;
  --sh1:0 1px 2px rgba(0,0,0,.4),0 8px 20px -10px rgba(0,0,0,.6);--sh2:0 24px 60px -18px rgba(0,0,0,.8);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(900px 500px at 105% -10%,color-mix(in srgb,var(--tea) 16%,transparent),transparent 60%),radial-gradient(700px 400px at -10% 110%,color-mix(in srgb,var(--turmeric) 12%,transparent),transparent 60%);
  color:var(--ink);font-family:var(--si);font-size:15px;line-height:1.5;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;min-height:48px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:0 14px;touch-action:manipulation;
  transition:transform .12s ease,background-color .2s ease,border-color .2s ease,box-shadow .2s ease,color .2s ease}
button:hover{border-color:color-mix(in srgb,var(--tea) 45%,var(--line))}
button:active{transform:scale(.96)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--turmeric);outline-offset:2px}
input{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:48px;padding:0 14px;width:100%;min-width:0;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--tea);box-shadow:0 0 0 4px color-mix(in srgb,var(--tea) 18%,transparent)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.demo{font-size:12px;color:var(--muted)}
h3{margin:0 0 8px;font-size:15px}

/* shell */
.app{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;max-width:none;height:100%;padding-block:10px}
.loginwrap{grid-column:1/-1;display:flex;flex-direction:column;gap:12px}
.main{display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0}
.rail{display:flex;flex-direction:column;gap:6px;background:linear-gradient(175deg,var(--tea),var(--tea2));border-radius:22px;padding:10px 8px;box-shadow:var(--sh1)}
.rail .logo{width:50px;height:50px;border-radius:16px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-weight:700;color:#fff;margin:2px auto 8px;font-size:24px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.rail .nav{min-height:64px;border:0;background:transparent;color:rgba(255,255,255,.82);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;padding:6px 2px}
.rail .nav svg{width:24px;height:24px}
.rail .nav:hover{background:rgba(255,255,255,.14);border-color:transparent}
.rail .nav[aria-selected="true"]{background:#fff;color:var(--tea2);box-shadow:0 8px 18px -8px rgba(0,0,0,.45)}
.rail .sp{flex:1}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 14px;background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh1)}
header h1{font-size:18px;margin:0;font-weight:700;line-height:1.25;flex:1 1 280px;min-width:0}
header h1 small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.hchips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;padding:4px 12px;border-radius:999px;font-size:13px;background:var(--panel2);min-height:38px;border:1px solid var(--line);color:var(--ink)}
.chip svg{width:16px;height:16px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--turmeric)}
.dot.on{background:var(--ok)}
.view{min-width:0;flex:1;min-height:0;overflow-y:auto;border-radius:20px}
.pos-v{overflow:hidden}.pos-v .pos{height:100%}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:12px;box-shadow:var(--sh1)}

/* sales */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 410px;grid-template-rows:minmax(0,1fr);gap:12px;align-items:stretch}
.left{display:flex;flex-direction:column;min-height:0;height:100%}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools input{flex:1 1 220px}
.cats{display:flex;gap:6px;overflow-x:auto;padding-block:8px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{white-space:nowrap;flex:0 0 auto;min-height:42px;border-radius:999px;padding:0 16px}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px;flex:1;min-height:0;overflow-y:auto;align-content:start;padding:2px 2px 8px}
.tile{--c:var(--tea);display:flex;flex-direction:column;justify-content:space-between;gap:8px;text-align:left;min-height:112px;padding:10px 12px;border-radius:var(--r);background:var(--tile);box-shadow:var(--sh1);position:relative;overflow:hidden}
.tile::after{content:"";position:absolute;right:-26px;top:-26px;width:80px;height:80px;border-radius:50%;background:color-mix(in srgb,var(--c) 14%,transparent);pointer-events:none}
.tile:hover{background:var(--tile-hover);transform:translateY(-2px);box-shadow:0 14px 26px -14px rgba(18,35,25,.4)}
.tile:active{transform:scale(.95)}
.tile .top{display:flex;gap:9px;align-items:flex-start;position:relative;z-index:1}
.tile .av{flex:0 0 auto;width:32px;height:32px;border-radius:11px;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:15px;background:color-mix(in srgb,var(--c) 20%,transparent);color:color-mix(in srgb,var(--c) 70%,var(--ink))}
.tile .nm{display:flex;flex-direction:column;min-width:0}
.tile b{font-weight:600;line-height:1.3;font-size:14.5px}
.tile .en{font-size:11px;color:var(--muted);line-height:1.25}
.tile .bot{display:flex;flex-direction:column;align-items:flex-start;gap:3px;position:relative;z-index:1}
.tile.grp .bot{flex-direction:row;align-items:center;justify-content:flex-end}
.tile .pr{display:flex;align-items:baseline;gap:3px}
.tile .pr strong{font-size:18px;font-weight:600}
.tile .pr em{font-style:normal;font-size:11px;color:var(--muted)}
.tile .st{font-size:12px;font-weight:600;color:var(--chilli);line-height:1.25;white-space:nowrap}
.tile .st.low{background:var(--chilli);color:var(--bg);padding:1px 8px;border-radius:999px}
.tile.grp{box-shadow:var(--sh1),0 7px 0 -3px var(--line);min-height:96px}
.tile.grp .more{margin-left:auto;font-size:26px;line-height:1;color:var(--muted)}
.bill{display:flex;flex-direction:column;gap:8px;height:100%;min-height:0;background:linear-gradient(180deg,var(--panel),var(--panel2))}
.custrow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.lines{display:flex;flex-direction:column;gap:6px;flex:1;min-height:0;overflow-y:auto}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.line .nm{font-weight:600;line-height:1.3}
.line .tot{font-weight:600;font-size:17px;text-align:right}
.line .dsc{font-size:12.5px;color:var(--ok);font-weight:600}
.line .ctl{grid-column:1/-1;display:flex;align-items:center;gap:6px;margin-top:4px}
.line .ctl button{min-height:44px;min-width:44px;padding:0;font-size:20px;font-weight:700;border-radius:12px}
.line .ctl .q{min-width:92px;font-size:16px;font-weight:600;background:var(--panel2)}
.line .ctl .pc{font-size:15px}
.line .ctl .rm{margin-left:auto;color:var(--chilli);font-size:14px;padding:0 12px;width:auto;border-color:transparent;background:transparent}
.empty{color:var(--muted);text-align:center;padding:36px 8px}
.sum{display:flex;flex-direction:column;gap:2px;font-size:14px;padding:6px 4px 0}
.sum div{display:flex;justify-content:space-between}
.sum .sv{color:var(--ok)}
.sum .gt{font-size:30px;font-weight:600;color:var(--tea);border-top:2px dashed var(--line);padding-top:6px;margin-top:4px;line-height:1.2}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pay{grid-column:1/-1;background:linear-gradient(135deg,var(--tea),var(--tea2));color:var(--tea-ink);border:0;min-height:62px;font-size:20px;font-weight:700;border-radius:16px;box-shadow:0 14px 24px -12px color-mix(in srgb,var(--tea) 80%,black)}
.pay:hover{border:0;filter:brightness(1.06)}

/* dialogs + keypads */
#modal{position:fixed;inset:0;background:rgba(6,16,11,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
#modal[hidden]{display:none}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:16px;width:min(100%,440px);max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:10px;box-shadow:var(--sh2)}
.dlg.wide{width:min(100%,780px)}.dlg.wide .list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.dlg h2{margin:0;font-size:18px}
.disp{position:relative;font-size:34px;font-weight:600;text-align:right;padding:6px 14px 6px 62px;background:var(--panel2);border-radius:16px;border:1px solid var(--line);min-height:62px}
.disp .clr{position:absolute;left:8px;top:50%;transform:translateY(-50%);min-height:44px;min-width:44px;padding:0;font-size:16px;font-weight:700;border-radius:12px;color:var(--chilli)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kp button{min-height:60px;font-size:24px;font-family:var(--num);font-weight:500;border-radius:16px;background:var(--panel2)}
.kp button:active{background:var(--tea);color:var(--tea-ink)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{flex:1 1 70px;min-height:48px;font-family:var(--num);font-weight:500;font-size:16px;border-radius:999px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.primary{background:linear-gradient(135deg,var(--tea),var(--tea2));color:var(--tea-ink);border:0;font-weight:700}
.primary:hover{border:0;filter:brightness(1.07)}
.seg{display:flex;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.msg{font-size:14px;color:var(--chilli)}
.msg.good{color:var(--ok)}
.list{display:flex;flex-direction:column;gap:6px}
.list button{display:flex;justify-content:space-between;align-items:center;text-align:left;gap:8px;border-radius:14px}
.list button:hover{background:var(--tile-hover)}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{min-height:44px;border-radius:999px}
.chips button[aria-pressed="true"]{background:var(--turmeric);color:#1b1500;border-color:var(--turmeric);font-weight:600}
.rscroll{overflow-y:auto;max-height:calc(100vh - 190px);padding:2px;min-height:0}
.cbw{position:relative}
.cbl{position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:5;max-height:230px;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh2)}
.cbl[hidden]{display:none}
.cbl button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;text-align:left;min-height:48px;background:transparent;padding:6px 14px;color:var(--ink)}
.cbl button:last-child{border-bottom:0}.cbl .sub{font-size:12px;color:var(--muted)}
/* bill paper */
.rcpt{background:#fff;color:#111;font-family:var(--si);font-size:13px;line-height:1.45;padding:14px 16px;border:1px solid #cfcfcf;border-radius:6px;width:100%;max-width:300px;margin:0 auto;box-shadow:0 10px 24px -14px rgba(0,0,0,.5)}
.rcpt .c{text-align:center}.rcpt hr{border:0;border-top:1px dashed #888;margin:6px 0}
.rcpt .r{display:flex;justify-content:space-between;gap:8px}
.rcpt .it{display:grid;grid-template-columns:1fr auto;gap:0 8px;margin-bottom:3px}
.rcpt .it small{color:#333;grid-column:1/-1;font-size:12px}
.rcpt .it small.dd{color:#000;font-style:italic}
.rcpt .big{font-size:17px;font-weight:700}
.rcpt .addr{font-size:12.5px;line-height:1.35}
/* stock + reports */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl th{font-size:12px;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel)}
.tbl td.n,.tbl th.n{text-align:right}
.tbl tbody tr:hover{background:var(--panel2)}
.scroll{overflow-x:auto}
.pill{display:inline-block;padding:1px 10px;border-radius:999px;font-size:12px;font-weight:600}
.pill.low{background:color-mix(in srgb,var(--chilli) 20%,transparent);color:var(--chilli)}
.pill.ok{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.sact{display:flex;gap:6px;flex-wrap:nowrap}.sact button{min-height:44px;padding:0 10px;white-space:nowrap;font-size:14px;border-radius:12px}
.sact .go{background:var(--tea);color:var(--tea-ink);border-color:var(--tea);font-weight:600}.sact .x{color:var(--chilli)}
.mv{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:2px 10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:baseline}
.mv .pos2{color:var(--ok);font-weight:700}.mv .neg2{color:var(--chilli);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{padding:12px 14px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(160deg,var(--panel),var(--panel2))}
.kpi span{font-size:12px;color:var(--muted)}.kpi strong{display:block;font-size:26px;line-height:1.2;font-weight:600}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--tea2),var(--tea));border-radius:6px}
.bar.warn i{background:var(--chilli)}
svg text{fill:var(--muted);font-family:var(--num);font-size:11px}
#toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;z-index:60;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--sh2)}
#toast[hidden]{display:none}
.loginCard{max-width:420px;margin:24px auto;width:100%;display:flex;flex-direction:column;gap:10px}

/* motion (only when the viewer has not asked for reduced motion) */
@media (prefers-reduced-motion:no-preference){
  @keyframes tileIn{from{opacity:0;transform:translateY(12px) scale(.95)}to{opacity:1;transform:none}}
  @keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes lineIn{from{opacity:0;transform:translateX(22px);background:color-mix(in srgb,var(--tea) 22%,var(--panel))}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:translateY(16px) scale(.95)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes printOut{from{clip-path:inset(0 0 100% 0);transform:translateY(-16px)}to{clip-path:inset(0 0 0 0);transform:none}}
  @keyframes bump{50%{transform:scale(1.05)}}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
  @keyframes pulseDot{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
  @keyframes lowPulse{50%{opacity:.7}}
  @keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
  .grid.enter .tile{animation:tileIn .4s cubic-bezier(.2,.85,.25,1) both;animation-delay:calc(min(var(--i,0),26)*16ms)}
  .view.enter>*{animation:viewIn .3s ease both}
  .line.fresh{animation:lineIn .36s cubic-bezier(.2,.85,.25,1) both}
  .dlg.pop{animation:pop .28s cubic-bezier(.2,.9,.25,1.08) both}
  #modal.fade{animation:fade .2s ease both}
  .dlg .rcpt.print{animation:printOut .8s cubic-bezier(.3,.7,.2,1) both}
  .gt.bump{animation:bump .32s ease}
  #toast{animation:toastIn .26s ease}
  .dot.on{animation:pulseDot 2.2s infinite}
  .tile .st.low{animation:lowPulse 2.4s ease-in-out infinite}
  .loginCard{animation:rise .5s cubic-bezier(.2,.85,.25,1) both}
}

/* print: only the 80 mm bill */
#printArea{display:none}
@page{size:80mm auto;margin:0}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  html,body{background:#fff!important;padding:0!important;margin:0!important}
  #printArea .rcpt{border:0;box-shadow:none;max-width:none;width:76mm;margin:0;padding:3mm 2mm;font-size:12px;color:#000;animation:none!important;clip-path:none!important}
  #printArea .rcpt .shopname{font-size:20px}
}

/* 15.6" kiosk (>= 900px wide): no page scroll, panels scroll inside */
@media(min-width:900px){
  body{overflow:hidden;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
}
@media(max-width:899px){
  .app{grid-template-columns:1fr;height:auto}
  .rail{flex-direction:row;overflow-x:auto}.rail .sp{display:none}.rail .logo{display:none}.rail .nav{min-width:72px;min-height:56px}
  .pos{grid-template-columns:minmax(0,1fr);grid-template-rows:none}.pos-v{overflow:visible}.pos-v .pos{height:auto}
  .grid{overflow:visible}.bill{height:auto}.left{height:auto}
  body{overflow:auto}.view{overflow:visible}
}
@media(max-height:820px){.kp button{min-height:50px;font-size:22px}.disp{min-height:50px;font-size:30px;padding-top:2px;padding-bottom:2px}.dlg{padding:12px;gap:8px}.tile{min-height:92px}.pay{min-height:56px}.cats{padding-block:6px}.rail .nav{min-height:58px}}
@media(max-width:700px){.dlg.wide .list{grid-template-columns:minmax(0,1fr)}}

/* ===== v2: picture cards, cart hero, warmer palette ===== */
:root{--bg:#fbf6ec;--panel2:#f8f2e5;--line:#eadfc9;--ink:#1c2a21;--muted:#6a7a6f;--tea:#1b8a52;--tea2:#0e6a3d;--turmeric:#ffb703;--chilli:#e04a35;--ok:#1b8a52;--tile-hover:#fffaf0}
.rail{background:linear-gradient(175deg,#1b8a52,#0b5a34)}
.rail .logo{background:linear-gradient(135deg,#ffd166,#ffb703);color:#3a2600;box-shadow:0 8px 18px -8px rgba(0,0,0,.5)}
.rail .logo svg{width:28px;height:28px}

var DAYMS=86400000;
function isoD(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function addDays(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x}
function isoAdd(iso,n){return isoD(addDays(new Date(iso+"T00:00:00"),n))}
function dayDiff(a,b){return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/DAYMS)+1}
function saleCost(l){return Math.round((pById[l.pid].cost||0)*l.qty/1000)}
function mkSale(no,date,time,method,cid,cart,billPct){
  var g=0,ls=cart.map(function(l){var rv=gross(l);g+=rv;return {pid:l.pid,qty:l.qty,rev:rv,cost:saleCost(l)}});
  var bd=billPct?Math.round(g*billPct/100):0,tot=g-bd,sum=0;
  ls.forEach(function(x){x.rev-=g?Math.round(bd*x.rev/g):0;sum+=x.rev});
  if(ls.length)ls[ls.length-1].rev+=tot-sum;
  return {no:no,date:date,time:time,method:method,cid:cid||0,gross:g,disc:bd,total:tot,cost:ls.reduce(function(a,x){return a+x.cost},0),lines:ls};
}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function seedSales(){
  var rnd=mulberry(20261105),pool=P.filter(function(p){return p.price>=2000&&p.price<=300000}),now=new Date(),sales=[],d,i,k;

  for(d=-45;d<=0;d++){
    var day=addDays(now,d),dow=day.getDay(),nb=d===0?37:Math.round(22+rnd()*16+(dow===0||dow===6?9:0)),maxH=d===0?15:19,times=[];
    for(i=0;i<nb;i++)times.push(8+Math.floor(rnd()*(maxH-7))+":"+("0"+Math.floor(rnd()*60)).slice(-2));
    times=times.map(function(x){return ("0"+x).slice(-5)}).sort();
    for(i=0;i<nb;i++){
      var nl=1+Math.floor(rnd()*4),cart=[];
      for(k=0;k<nl;k++){var p=pool[Math.floor(rnd()*pool.length)];cart.push({pid:p.id,qty:loose(p)?[250,500,1000,1500,2000][Math.floor(rnd()*5)]:1000*(1+Math.floor(rnd()*3)),d:null})}
      var cr=rnd()<0.07,cid=cr?1+Math.floor(rnd()*4):0,pct=rnd()<0.1?[3,5][Math.floor(rnd()*2)]:0;
      var no=isoD(day).slice(2).replace(/-/g,"")+"-"+("00"+(i+1)).slice(-3);
      sales.push(mkSale(no,isoD(day),times[i],cr?"credit":"cash",cid,cart,pct));
    }
  }
  return sales;
}

function rgRange(st){
  var td=new Date(),f,e;
  switch(st.p){
   case "today":f=e=td;break;
   case "yest":f=e=addDays(td,-1);break;
   case "7d":f=addDays(td,-6);e=td;break;
   case "30d":f=addDays(td,-29);e=td;break;
   case "month":f=new Date(td.getFullYear(),td.getMonth(),1);e=td;break;
   case "last":f=new Date(td.getFullYear(),td.getMonth()-1,1);e=new Date(td.getFullYear(),td.getMonth(),0);break;
   default:var a=st.from||isoD(td),b=st.to||isoD(td);return a<=b?{from:a,to:b}:{from:b,to:a};
  }
  return {from:isoD(f),to:isoD(e)};
}
function rgPrev(r){var n=dayDiff(r.from,r.to);return {from:isoAdd(r.from,-n),to:isoAdd(r.from,-1)}}
function agg(r){
  var days={},T={bills:0,gross:0,disc:0,net:0,cost:0,cash:0,credit:0,collected:0},items={};
  function day(d){return days[d]||(days[d]={d:d,bills:0,gross:0,disc:0,net:0,cost:0,cash:0,credit:0,collected:0})}
  S.sales.forEach(function(x){if(x.date<r.from||x.date>r.to)return;var d=day(x.date);d.bills++;d.gross+=x.total+x.disc;d.disc+=x.disc;d.net+=x.total;d.cost+=x.cost;if(x.method==="credit")d.credit+=x.total;else d.cash+=x.total;
    x.lines.forEach(function(l){var it=items[l.pid]||(items[l.pid]={pid:l.pid,q:0,rev:0,cost:0});it.q+=l.qty;it.rev+=l.rev;it.cost+=l.cost})});
  S.ledger.forEach(function(e){if(e.type!=="payment")return;var dd=e.at.slice(0,10);if(dd<r.from||dd>r.to)return;day(dd).collected+=-e.amt});
  if(dayDiff(r.from,r.to)<=93){for(var d=r.from;d<=r.to;d=isoAdd(d,1))day(d)}
  var list=Object.keys(days).sort().map(function(k){return days[k]});
  list.forEach(function(x){["bills","gross","disc","net","cost","cash","credit","collected"].forEach(function(k){T[k]+=x[k]})});
  T.profit=T.net-T.cost;T.margin=T.net?T.profit/T.net*100:0;
  return {list:list,T:T,items:Object.keys(items).map(function(k){return items[k]})};
}

/* state of a credit sale of T cents for customer c: ok | warn (>= alert level) | block (over limit) | nolimit */

function cbBuild(kind,q){
  q=(q||"").trim().toLowerCase();var items=[];
  function hit(a,b){return !q||String(a).toLowerCase().indexOf(q)>-1||String(b).toLowerCase().indexOf(q)>-1}
  if(kind==="prod"){
    P.forEach(function(p){if(hit(fullSi(p),fullEn(p))||hit(p.code,""))items.push({t:"ex",id:p.id,si:fullSi(p),en:fullEn(p),sub:t("inshop")})});
    COMMON.forEach(function(c){if(P.some(function(p){return p.en.toLowerCase()===c[1].toLowerCase()}))return;if(hit(c[0],c[1]))items.push({t:"cm",c:c,si:c[0],en:c[1],sub:"~"+rs(c[4]*100)+" /"+(c[3]==="pcs"?"pcs":c[3])})});
  }else{
    Object.keys(GROUPS).forEach(function(id){var G=GROUPS[id];if(hit(G.si,G.en))items.push({t:"g",id:id,si:G.si,en:G.en,sub:""})});
  }
  if(kind==="prod")return items.filter(function(i){return i.t==="cm"}).slice(0,12).concat(items.filter(function(i){return i.t==="ex"}).slice(0,28));
  return items.slice(0,40);
}

/* kg items: 1 kg price, quantity stored in grams (milli-kg). Entry in kg (decimals) or g. Pieces: whole numbers. */
function stkCalc(m){var p=pById[m.pid],x=parseFloat(m.v)||0,dq;if(loose(p))dq=m.u==="small"?Math.round(x):Math.round(x*1000);else dq=Math.round(x)*1000;
  return {p:p,dq:dq,cur:p.stock,nS:m.mode==="in"?p.stock+dq:m.mode==="out"?p.stock-dq:dq}}
function applyStk(m){
  var c=stkCalc(m);
  if(m.mode==="out"&&c.dq>c.cur)return;
  var buy=rupees(m.buy),sell=rupees(m.sell);
  if(m.mode==="in"){
    if(!(c.dq>0)||!(buy>0)||!(sell>0))return;
    if(sell!==c.p.price&&!isOwner()&&!m.ok){m.pin=true;m.pinv="";m.err=false;drawModal();return}
  }
  var oldPrice=c.p.price;
  c.p.stock=Math.max(0,c.nS);
  logMove(c.p,c.p.stock-c.cur,m.mode,m.reason);
  if(m.mode==="in"){
    c.p.cost=buy;
    if(sell!==oldPrice){c.p.price=sell;c.p.est=false;S.moves.unshift({at:clock(),pid:c.p.id,nm:fullSi(c.p),unit:c.p.unit,q:0,type:"price",key:"",txt:money(oldPrice)+" → "+money(sell)})}
    S.batches.unshift({at:clock(),pid:c.p.id,nm:fullSi(c.p),unit:c.p.unit,q:c.dq,buy:buy,sell:sell,by:S.user?S.user.name:""});if(S.batches.length>40)S.batches.pop();
  }
  modal=null;toast(t("stkok")+" · "+pname(c.p)+" "+nf(c.p.stock)+" "+c.p.unit);scheduleSync();render();
}

  switch(a){
   case "lang":S.lang=S.lang==="si"?"en":"si";ENTER=true;render();break;
   case "net":S.online=!S.online;if(S.online)scheduleSync();else clearTimeout(tmr);toast(S.online?t("online"):t("offline"));render();break;
   case "autop":S.autoPrint=!S.autoPrint;toast(t("autop")+': '+(S.autoPrint?'ON':'OFF'));render();break;
   case "tab":S.tab=v;ENTER=true;render();break;
   case "cat":S.cat=v;S.sub="all";ENTER=true;render();break;
   case "fam":S.fam=v;S.q="";ENTER=true;render();break;
   case "prod":var po=PRODS[v];if(!po)break;if(po.items.length===1){var p1=po.items[0];if(loose(p1)){modal={k:"weight",pid:p1.id,v:""};drawModal()}else addItem(p1.id,1000)}else{modal={k:"prod",pk:v,bi:0,cnt:{}};drawModal()}break;
   case "pbr":modal.bi=+v;drawModal();break;
   case "pq":var pq=v.split(":");modal.cnt=modal.cnt||{};modal.cnt[pq[0]+":"+pq[1]]=(modal.cnt[pq[0]+":"+pq[1]]||0)+(+pq[1]);addItem(+pq[0],+pq[1]);break;
   case "pcw":modal={k:"weight",pid:+v,v:""};drawModal();break;
   case "sub":S.sub=v;ENTER=true;render();break;
   case "cview":S.cview=v;ENTER=true;render();break;
   case "goreg":modal=null;S.tab="credit";S.cview="reg";ENTER=true;render();break;
   case "rgp":var pp=v.split("|"),st0=S[pp[0]];if(pp[1]==="custom"){var rr=rgRange(st0);st0.from=rr.from;st0.to=rr.to}st0.p=pp[1];render();break;
   case "add":var p=pById[+v];if(loose(p)){modal={k:"weight",pid:p.id,v:""};drawModal()}else addItem(p.id,1000);break;
   case "inc":var l=S.cart[+v];l.qty+=loose(pById[l.pid])?250:1000;render();break;
   case "dec":var l2=S.cart[+v];l2.qty-=loose(pById[l2.pid])?250:1000;if(l2.qty<=0)S.cart.splice(+v,1);render();break;
   case "del":S.cart.splice(+v,1);if(!S.cart.length)S.bd=null;render();break;
   case "qedit":var l3=S.cart[+v],p3=pById[l3.pid];if(loose(p3)){modal={k:"weight",pid:p3.id,idx:+v,v:String(l3.qty)};drawModal()}break;
   case "hold":if(!S.cart.length)break;S.held.push({cart:S.cart,cust:S.cust,bd:S.bd});S.cart=[];S.cust=null;S.bd=null;toast(t("held"));render();break;
   case "recall":modal={k:"recall"};drawModal();break;
   case "rc":var b=S.held.splice(+v,1)[0];S.cart=b.cart;S.cust=b.cust;S.bd=b.bd;modal=null;render();break;
   case "discm":if(!S.cart.length)break;modal={k:"disc",scope:"bill",t:"p",v:S.bd&&S.bd.t==="p"?String(S.bd.v):""};drawModal();break;
   case "ldisc":var ld=S.cart[+v].d;modal={k:"disc",scope:+v,t:"p",v:ld&&ld.t==="p"?String(ld.v):""};drawModal();break;
   case "dt":modal.t=v;modal.v="";drawModal();break;
   case "qd":modal.v=String(v);drawModal();break;
   case "dok":applyDisc(modal);break;
   case "dclear":if(modal.scope==="bill")S.bd=null;else S.cart[modal.scope].d=null;modal=null;render();break;
   case "pinok":if(modal.pinv===OWNER_PIN){modal.ok=true;modal.pin=false;if(modal.k==="disc")applyDisc(modal);else if(modal.k==="stk")applyStk(modal);else if(modal.k==="delp")doDelete(modal);else if(modal.k==="pr")applyPrice(modal);else if(modal.k==="pay"){modal.ok=true;modal.pin=false;drawModal()}}else{modal.err=true;modal.pinv="";drawModal()}break;
   case "stk":var sv=v.split(":");modal={k:"stk",pid:+sv[0],mode:sv[1],u:"big",v:"",reason:sv[1]==="in"?"r_purchase":sv[1]==="out"?"r_damaged":"r_count"};stkInit(modal);drawModal();break;
   case "sm":modal.mode=v;modal.v="";modal.reason=v==="in"?"r_purchase":v==="out"?"r_damaged":"r_count";stkInit(modal);drawModal();break;
   case "su":modal.u=v;modal.v="";drawModal();break;
   case "sr":modal.reason=v;drawModal();break;
   case "stkok":applyStk(modal);break;
   case "delp":modal={k:"delp",pid:+v};drawModal();break;
   case "delgo":if(isOwner())doDelete(modal);else{modal.pin=true;modal.pinv="";modal.err=false;drawModal()}break;
   case "newp":modal={k:"newp",err:"",f:{si:"",en:"",fam:"F001",brand:"",size:"",unit:"pcs",price:"",qty:"",code:"",cost:""}};drawModal();break;
   case "npc":modal.f.cat=v;modal.f.sub="";drawModal();break;
   case "npsub":modal.f.sub=v;drawModal();break;
   case "npu":modal.f.unit=v;drawModal();break;
   case "npok":addProduct(modal);break;
   case "lowonly":S.lowOnly=!S.lowOnly;render();break;
   case "newc":modal={k:"newc",c:{n:"",ph:""},err:""};drawModal();break;
   case "newc2":modal={k:"newc",c:{n:"",ph:""},err:"",fromBill:true};drawModal();break;
   case "newcok":addCustomer(modal);break;
   case "limm":if(isOwner()){modal={k:"lim",cid:+v,v:String(+(custOf(+v).lim/100).toFixed(2)||"")};drawModal()}break;
   case "limok":applyLimit(modal);break;
   case "stm":modal={k:"stm",cid:+v};drawModal();break;
   case "ovr":modal.pin=true;modal.pinv="";modal.err=false;drawModal();break;
   case "qfull":modal.v=String(custOf(modal.cid).bal/100);drawModal();break;
   case "alertpct":S.alertPct=+v;saveAlert();render();break;
   case "fld":modal.fld=v;drawModal();break;
   case "cattog":S.hiddenCats[v]=!S.hiddenCats[v];if(!S.hiddenCats[v])delete S.hiddenCats[v];saveHidden();render();break;
   case "gall":modal.all=true;drawModal();break;
   case "grp":modal={k:"grp",g:v};drawModal();break;
   case "gsel":modal={k:"weight",pid:+v,v:"",fromG:modal.g};drawModal();break;
   case "wback":modal={k:"grp",g:modal.fromG};drawModal();break;
   case "npg":modal.f.g=v;drawModal();break;
   case "cbp":cbPick(v);break;
   case "theme":toggleTheme();break;
   case "lock":S.user=null;modal=null;LG.pin="";LG.err="";render();break;
   case "lu":LG.uid=v;LG.pin="";LG.err="";render();break;
   case "lk":loginKey(v);break;
   case "pr":modal={k:"pr",pid:+v,v:""};drawModal();break;
   case "prok":applyPrice(modal);break;
   case "custpick":modal={k:"cust"};drawModal();break;
   case "pickc":S.cust=+v||null;modal=null;render();if(S.cust){var pc2=custOf(S.cust),st3=cstat(pc2);if(st3==="near")toast(t("nearlimit")+" · "+pc2.n+" · "+pctTxt(pc2.bal/pc2.lim*100));else if(st3==="over")toast(t("overlimit")+" · "+pc2.n);else if(st3==="none")toast(t("nolimit")+" · "+pc2.n)}break;
   case "paym":modal={k:"pay",m:"cash",v:""};drawModal();break;
   case "repay":modal={k:"repay",cid:+v,v:""};drawModal();break;
   case "pm":modal.m=v;modal.v="";drawModal();break;
   case "qc":modal.v=v==="exact"?String(total()/100):String(v);drawModal();break;
   case "qk":modal.v=String(v);drawModal();break;
   case "kp":kpress(v);break;
   case "wok":var g=+modal.v;if(modal.idx!=null){S.cart[modal.idx].qty=g}else addItem(modal.pid,g);modal=null;render();break;
   case "mok":var c=custOf(modal.cid),amt=Math.min(c.bal,rupees(modal.v));if(!(amt>0))break;c.bal-=amt;ledgerAdd(c.id,"payment",-amt,"cash");S.rep.drawer+=amt;S.rep.repaid=(S.rep.repaid||0)+amt;S.outbox+=2;modal=null;toast(t("repaid")+" · "+rs(amt));scheduleSync();render();break;
   case "finish":finishSale();break;
   case "print":doPrint();break;
   case "ebill":toast(modal.s.cust?t("ebillok"):t("ebillno"));break;
   case "zrep":modal={k:"z",v:String(Math.round(S.rep.drawer/100))};drawModal();break;
   case "zclose":modal=null;toast(t("shiftclosed"));render();break;
   case "mclose":modal=null;render();break;
  }
}
document.addEventListener("focusin",function(e){if(modal&&modal.k==="newp"&&e.target.dataset&&e.target.dataset.cb)cbRender(e.target)});
document.addEventListener("click",function(e){
  if(e.target===$m){modal=null;render();return}
  if(!e.target.closest(".cbw")){var cl=document.querySelectorAll(".cbl");for(var i=0;i<cl.length;i++)cl[i].hidden=true}
  var b=e.target.closest("[data-a]");if(!b||b.disabled)return;act(b.dataset.a,b.dataset.v);
});
document.addEventListener("change",function(e){
  var d=e.target.dataset;if(d&&d.rgk&&e.target.value){var st=S[d.rgk],rr=rgRange(st);st.from=rr.from;st.to=rr.to;st[d.rgf]=e.target.value;st.p="custom";render()}
});
document.addEventListener("input",function(e){
  if(e.target.id==="q"){S.q=e.target.value;render()}
  else if(e.target.id==="sq"){S.sq=e.target.value;render()}
  else if(e.target.id==="cq"){S.cq=e.target.value;render()}
  else if(e.target.dataset&&e.target.dataset.cf&&modal&&modal.k==="newc"){modal.c[e.target.dataset.cf]=e.target.value}
  else if(e.target.id==="gq"&&modal&&modal.k==="grp"){modal.q=e.target.value;modal.focusQ=true;drawModal()}
  else if(e.target.dataset&&e.target.dataset.f&&modal&&modal.k==="newp"){modal.f[e.target.dataset.f]=e.target.value;if(e.target.dataset.cb){if(e.target.dataset.f==="gname")modal.f.g="";cbRender(e.target)}}
});
document.addEventListener("keydown",function(e){
  if(!S.user){if(/^[0-9]$/.test(e.key))loginKey(e.key);else if(e.key==="Backspace")loginKey("⌫");return}
  if(modal&&!(e.target&&e.target.tagName==="INPUT")){
    if($m.querySelector('[data-a="kp"]')&&/^[0-9.]$/.test(e.key)){act("kp",e.key);e.preventDefault();return}
    if($m.querySelector('[data-a="kp"]')&&e.key==="Backspace"){act("kp","⌫");e.preventDefault();return}
    if(e.key==="Enter"){var pb=$m.querySelector(".primary:not(:disabled)");if(pb){pb.click();e.preventDefault();return}}
  }
  if(e.target.id==="q"&&e.key==="Enter"){
    var q=S.q.trim(),p=P.find(function(x){return x.code===q});
    if(p){S.q="";if(loose(p)){modal={k:"weight",pid:p.id,v:""}}else addItem(p.id,1000);render()}
  }
  if(e.key==="Escape"&&modal){modal=null;render()}
});
